<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Book Hero Quiz</title>
    <!-- Using Tailwind for rapid layout, custom CSS for the comic aesthetic -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FFCC00; /* Comic Yellow */
            --secondary: #E30022; /* Action Red */
            --tertiary: #0066CC; /* Hero Blue */
            --dark: #1A1A1A; /* Ink Black */
            --light: #F0F0F0; /* Paper White */
        }

        body {
            font-family: 'Comic Neue', cursive;
            background-color: var(--light);
            /* Halftone pattern background */
            background-image: radial-gradient(var(--dark) 15%, transparent 16%),
                              radial-gradient(var(--dark) 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        /* The main comic panel container */
        .comic-panel {
            background-color: white;
            border: 4px solid var(--dark);
            box-shadow: 10px 10px 0px var(--dark);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        /* Header typography */
        h1, h2, h3, .bangers-font {
            font-family: 'Bangers', cursive;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .comic-btn {
            background-color: var(--primary);
            border: 3px solid var(--dark);
            color: var(--dark);
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            padding: 10px 20px;
            cursor: pointer;
            position: relative;
            transition: all 0.1s ease;
            box-shadow: 4px 4px 0px var(--dark);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .comic-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--dark);
        }

        .comic-btn:hover {
            background-color: var(--tertiary);
            color: white;
        }

        /* Answer buttons specific styling */
        .answer-btn {
            background-color: white;
            border: 3px solid var(--dark);
            color: var(--dark);
            font-family: 'Comic Neue', cursive;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 15px;
            margin: 10px 0;
            width: 100%;
            text-align: left;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--dark);
            transition: all 0.1s;
            position: relative;
        }

        .answer-btn:hover {
            background-color: #f0f0f0;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--dark);
        }

        .answer-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--dark);
        }

        .answer-btn.correct {
            background-color: #4ade80; /* Green */
            color: white;
        }
        
        .answer-btn.wrong {
            background-color: var(--secondary);
            color: white;
        }
        
        .answer-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        /* Action bursts (Pow, Bam, etc) */
        .action-burst {
            position: absolute;
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            color: var(--primary);
            text-shadow: 4px 4px 0 var(--dark), -2px -2px 0 var(--secondary);
            transform: rotate(-15deg) scale(0);
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s;
        }

        .action-burst.show {
            transform: rotate(-15deg) scale(1);
            opacity: 1;
        }

        /* Speech bubble for the question */
        .speech-bubble {
            position: relative;
            background: white;
            border-radius: 10px;
            border: 4px solid var(--dark);
            padding: 20px;
            margin-bottom: 30px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -24px;
            left: 20px;
            border-width: 20px 20px 0 0;
            border-style: solid;
            border-color: var(--dark) transparent transparent transparent;
            display: block;
            width: 0;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 24px;
            border-width: 16px 16px 0 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
            display: block;
            width: 0;
            z-index: 1;
        }

        /* Title styling */
        .comic-title {
            color: var(--primary);
            text-shadow: 4px 4px 0 var(--dark), -2px -2px 0 var(--secondary);
            font-size: 3.5rem;
            line-height: 1.1;
            text-align: center;
            margin-bottom: 2rem;
            transform: rotate(-3deg);
        }

        /* Screen visibility */
        .screen {
            display: none;
        }
        
        .screen.active {
            display: block;
        }

        /* Progress bar */
        .progress-container {
            width: 100%;
            height: 20px;
            background-color: white;
            border: 3px solid var(--dark);
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--tertiary);
            width: 0%;
            transition: width 0.3s ease;
            border-right: 3px solid var(--dark);
        }
    </style>
</head>
<body>

    <div class="comic-panel w-full max-w-2xl p-6 md:p-10 relative">
        
        <!-- Action burst element for visual feedback -->
        <div id="actionBurst" class="action-burst top-1/4 right-10">BAM!</div>

        <!-- Start Screen -->
        <div id="startScreen" class="screen active flex flex-col items-center justify-center py-10">
            <h1 class="comic-title">Hero<br>Trivia<br>Showdown!</h1>
            <p class="mb-8 text-center text-lg font-bold">Test your knowledge of the comic multiverse!</p>
            <button id="startBtn" class="comic-btn text-2xl px-8 py-4">Start Mission!</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quizScreen" class="screen">
            <div class="flex justify-between items-center mb-4 bangers-font text-xl">
                <span>Score: <span id="scoreDisplay" class="text-2xl text-blue-600">0</span></span>
                <span>Issue: <span id="questionCountDisplay" class="text-2xl">1/5</span></span>
            </div>
            
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <div class="speech-bubble" id="questionText">
                Loading next challenge...
            </div>

            <div id="answersContainer" class="flex flex-col gap-2 mt-8">
                <!-- Buttons will be injected here -->
            </div>

            <div class="mt-6 flex justify-end">
                <button id="nextBtn" class="comic-btn hidden">Next Page &#10140;</button>
            </div>
        </div>

        <!-- End Screen -->
        <div id="endScreen" class="screen flex flex-col items-center justify-center py-10">
            <h1 class="comic-title" style="font-size: 3rem;">Mission<br>Complete!</h1>
            
            <div class="bg-yellow-200 border-4 border-black p-6 w-full text-center mb-8 transform rotate-2">
                <h2 class="bangers-font text-3xl mb-2">Final Score</h2>
                <div class="bangers-font text-6xl text-red-600 mb-4" id="finalScore">0</div>
                <p id="rankMessage" class="font-bold text-xl">Hero Rank: Civilian</p>
            </div>

            <button id="restartBtn" class="comic-btn text-xl">Play Again!</button>
        </div>

    </div>

    <script>
        // Quiz Data
        const quizData = [
            {
                question: "Which superhero is known as the 'Caped Crusader'?",
                answers: ["Superman", "Batman", "Spider-Man", "Iron Man"],
                correct: 1
            },
            {
                question: "What is the true identity of the Incredible Hulk?",
                answers: ["Tony Stark", "Steve Rogers", "Bruce Banner", "Reed Richards"],
                correct: 2
            },
            {
                question: "Which fictional metal is Wolverine's skeleton laced with?",
                answers: ["Vibranium", "Adamantium", "Kryptonite", "Uru"],
                correct: 1
            },
            {
                question: "What newspaper does Peter Parker work for?",
                answers: ["The Daily Planet", "The Daily Bugle", "The Gotham Gazette", "The Metropolis Star"],
                correct: 1
            },
            {
                question: "Who is the ruler of the underwater kingdom of Atlantis in DC Comics?",
                answers: ["Namor", "Ocean Master", "Aquaman", "Black Manta"],
                correct: 2
            },
            {
                question: "What is the name of Thor's enchanted hammer?",
                answers: ["Stormbreaker", "Mjolnir", "Gungnir", "Excalibur"],
                correct: 1
            },
            {
                question: "Which supervillain uses a weaponized umbrella?",
                answers: ["The Joker", "The Riddler", "Two-Face", "The Penguin"],
                correct: 3
            },
             {
                question: "What alien race is Superman from?",
                answers: ["Martian", "Kryptonian", "Skrull", "Kree"],
                correct: 1
            }
        ];

        // Game State
        let currentQuestionIndex = 0;
        let score = 0;
        let gameQuestions = [];
        const QUESTIONS_PER_GAME = 5;

        // DOM Elements
        const screens = {
            start: document.getElementById('startScreen'),
            quiz: document.getElementById('quizScreen'),
            end: document.getElementById('endScreen')
        };
        
        const ui = {
            startBtn: document.getElementById('startBtn'),
            nextBtn: document.getElementById('nextBtn'),
            restartBtn: document.getElementById('restartBtn'),
            questionText: document.getElementById('questionText'),
            answersContainer: document.getElementById('answersContainer'),
            scoreDisplay: document.getElementById('scoreDisplay'),
            questionCountDisplay: document.getElementById('questionCountDisplay'),
            progressBar: document.getElementById('progressBar'),
            actionBurst: document.getElementById('actionBurst'),
            finalScore: document.getElementById('finalScore'),
            rankMessage: document.getElementById('rankMessage')
        };

        // Words for the action bursts
        const burstWords = ["POW!", "BAM!", "ZAP!", "WHAM!", "BOOM!"];

        // Event Listeners
        ui.startBtn.addEventListener('click', startGame);
        ui.nextBtn.addEventListener('click', loadNextQuestion);
        ui.restartBtn.addEventListener('click', startGame);

        // Functions
        function switchScreen(screenName) {
            Object.values(screens).forEach(screen => screen.classList.remove('active'));
            screens[screenName].classList.add('active');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            // Reset state
            score = 0;
            currentQuestionIndex = 0;
            
            // Select random questions
            const shuffled = shuffleArray([...quizData]);
            gameQuestions = shuffled.slice(0, QUESTIONS_PER_GAME);
            
            // Update UI
            updateScore();
            switchScreen('quiz');
            loadQuestion();
        }

        function loadQuestion() {
            ui.nextBtn.classList.add('hidden');
            const currentQ = gameQuestions[currentQuestionIndex];
            
            // Update progress
            ui.questionCountDisplay.innerText = `${currentQuestionIndex + 1}/${QUESTIONS_PER_GAME}`;
            const progressPercent = (currentQuestionIndex / QUESTIONS_PER_GAME) * 100;
            ui.progressBar.style.width = `${progressPercent}%`;
            
            // Set question text
            ui.questionText.innerText = currentQ.question;
            
            // Clear and generate answer buttons
            ui.answersContainer.innerHTML = '';
            
            // Create a scrambled list of indices to randomize answer order
            const answerIndices = [0, 1, 2, 3];
            shuffleArray(answerIndices);

            answerIndices.forEach(originalIndex => {
                const btn = document.createElement('button');
                btn.classList.add('answer-btn');
                btn.innerText = currentQ.answers[originalIndex];
                
                // Store the original index so we know if it's correct
                btn.dataset.index = originalIndex;
                
                btn.addEventListener('click', () => selectAnswer(btn, currentQ.correct));
                ui.answersContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedBtn, correctIndex) {
            // Disable all buttons
            const allBtns = ui.answersContainer.querySelectorAll('.answer-btn');
            allBtns.forEach(btn => btn.disabled = true);

            const selectedIndex = parseInt(selectedBtn.dataset.index);
            const isCorrect = selectedIndex === correctIndex;

            if (isCorrect) {
                selectedBtn.classList.add('correct');
                score += 100;
                updateScore();
                showActionBurst(true);
            } else {
                selectedBtn.classList.add('wrong');
                // Highlight correct answer
                const correctBtn = Array.from(allBtns).find(btn => parseInt(btn.dataset.index) === correctIndex);
                if(correctBtn) correctBtn.classList.add('correct');
                showActionBurst(false);
            }

            ui.nextBtn.classList.remove('hidden');
        }

        function showActionBurst(isCorrect) {
            if (isCorrect) {
                const word = burstWords[Math.floor(Math.random() * burstWords.length)];
                ui.actionBurst.innerText = word;
                ui.actionBurst.style.color = 'var(--primary)';
            } else {
                ui.actionBurst.innerText = "OOPS!";
                ui.actionBurst.style.color = 'var(--secondary)';
            }

            // Random position slightly
            const top = 20 + Math.random() * 40;
            const right = 10 + Math.random() * 20;
            ui.actionBurst.style.top = `${top}%`;
            ui.actionBurst.style.right = `${right}%`;

            ui.actionBurst.classList.add('show');
            
            setTimeout(() => {
                ui.actionBurst.classList.remove('show');
            }, 800);
        }

        function updateScore() {
            ui.scoreDisplay.innerText = score;
        }

        function loadNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < QUESTIONS_PER_GAME) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            ui.progressBar.style.width = '100%';
            
            setTimeout(() => {
                switchScreen('end');
                ui.finalScore.innerText = score;
                
                let rank = "";
                const maxScore = QUESTIONS_PER_GAME * 100;
                
                if (score === maxScore) rank = "Cosmic Entity! 🌟";
                else if (score >= maxScore * 0.8) rank = "A-List Avenger! 🦸‍♂️";
                else if (score >= maxScore * 0.6) rank = "Sidekick 🏃‍♂️";
                else if (score >= maxScore * 0.4) rank = "Bystander 👀";
                else rank = "Henchman 🦹‍♂️";
                
                ui.rankMessage.innerText = `Hero Rank: ${rank}`;
            }, 500); // small delay to see the bar hit 100%
        }
    </script>
</body>
</html>
